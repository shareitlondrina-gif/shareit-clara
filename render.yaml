services:
  - type: web
    name: shareit-clara
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health/live
    autoDeploy: true
    envVars:
      - key: CLARA_POSTGRES
        sync: false
      - key: CLARA_BANCO_NOME
        value: "shareit_clara"
      - key: CLARA_CRIAR_BANCO
        value: "true"
      - key: CLARA_ADMIN_SENHA
        sync: false
      - key: CLARA_ADMIN_EMAIL
        sync: false
      - key: CLARA_URL_PUBLICA
        value: "https://shareit-clara.onrender.com"
      - key: CLARA_EXECUTAR_MIGRACOES
        value: "true"
      - key: CLARA_TENANT_NOME
        value: "Share IT"
      - key: CLARA_TENANT_IDENTIFICADOR
        value: "shareit"
      # Transporte de e-mail da plataforma. Host/usuário/senha são definidos como segredos no Render.
      - key: CLARA_EMAIL_SMTP_HOST
        sync: false
      - key: CLARA_EMAIL_SMTP_PORT
        value: "587"
      - key: CLARA_EMAIL_SMTP_SSL
        value: "true"
      - key: CLARA_EMAIL_SMTP_USER
        sync: false
      - key: CLARA_EMAIL_SMTP_PASSWORD
        sync: false
      - key: CLARA_EMAIL_FROM
        value: "monitoramento.clara@shareitbrasil.com.br"
      - key: CLARA_EMAIL_FROM_NAME
        value: "Share IT .Clara"
